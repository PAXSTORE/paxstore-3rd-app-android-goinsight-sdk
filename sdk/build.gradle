apply plugin: 'com.android.library'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

android {
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 19
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 29

        manifestPlaceholders = [versionName : "${version}"]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // add sdk proguard to aar
        consumerProguardFiles 'proguard-rules.pro'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    packagingOptions {
        exclude 'LICENSE.txt'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
    }
    buildFeatures {
        aidl true
    }
    namespace 'com.pax.market.android.app.goinsight.sdk'
    compileOptions {
        //It is strongly recommended to set it to Java 8 or Java 11 for the best compatibility.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.slf4j:slf4j-android:1.7.25'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.whatspos.sdk:paxstore-3rd-app-java-sdk:11.0.0'
    compileOnly 'com.whatspos.sdk:paxstore-3rd-app-android-sdk:11.0.0'
}

apply from :"../publishAndroidLib.gradle"

tasks.named('publish') {
    dependsOn 'clean'
}